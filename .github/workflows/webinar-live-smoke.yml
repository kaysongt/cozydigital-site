name: Webinar live smoke check

on:
  push:
    branches: [qa/webinar-live-20261022]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify published HTML, CORS and one labelled QA submission
        env:
          PUBLIC_INTAKE_KEY: ${{ secrets.NEXT_PUBLIC_HUB_WEBHOOK_SECRET || vars.NEXT_PUBLIC_HUB_WEBHOOK_SECRET }}
        run: |
          mkdir -p /tmp/webinar-live-results
          python3 - <<'PY'
          import json, os, time, urllib.request
          from pathlib import Path
          from datetime import datetime, timezone
          destination = Path('/tmp/webinar-live-results')
          report = {'pageLoaded': False, 'corsPreflightPassed': False, 'liveSaveAcknowledged': False, 'crmReadback': False, 'emailDeliveryTested': False, 'testLeadLabel': 'WEBINAR QA - EXCLUDE (API CHECK)'}
          try:
              page_url = 'https://cozydigital.org/courses/cozy-ai-video-course/?qa=' + str(int(time.time()))
              with urllib.request.urlopen(urllib.request.Request(page_url, headers={'Cache-Control': 'no-cache'}), timeout=25) as response:
                  assert response.status == 200
                  html = response.read().decode('utf-8')
              assert 'webinar-title' in html and 'Less guessing.' in html and 'Join the free webinar list' in html, 'Expected webinar UI not found on the live page'
              report['pageLoaded'] = True
              destination.joinpath('live-page.html').write_text(html)
              endpoint = 'https://hub.cozydigital.org/api/webhook/lead'
              origin = 'https://cozydigital.org'
              key = os.environ.get('PUBLIC_INTAKE_KEY', '')
              requested_headers = 'content-type' + (',x-webhook-secret' if key else '')
              preflight = urllib.request.Request(endpoint, method='OPTIONS', headers={'Origin': origin, 'Access-Control-Request-Method': 'POST', 'Access-Control-Request-Headers': requested_headers})
              with urllib.request.urlopen(preflight, timeout=20) as response:
                  assert response.status in (200, 204)
                  assert response.headers.get('Access-Control-Allow-Origin') in ('*', origin)
                  assert 'POST' in response.headers.get('Access-Control-Allow-Methods', '').upper()
                  allowed = response.headers.get('Access-Control-Allow-Headers', '').lower()
                  assert allowed == '*' or all(header in allowed for header in requested_headers.split(','))
              report['corsPreflightPassed'] = True
              payload = {'name': 'WEBINAR QA - EXCLUDE (API CHECK)', 'email': 'out+webinar-qa-20261022@cozydigital.org', 'leadSource': 'AI Video Webinar · qa', 'notes': 'QA / TEST ONLY for the webinar page build on October 22, 2026. Exclude from the invite list. Do not contact. Not a real customer registration. Optional marketing consent: no. This is an API acceptance check, not an attendee.', 'hp': ''}
              headers = {'Content-Type': 'application/json', 'Origin': origin}
              if key:
                  headers['x-webhook-secret'] = key
              request = urllib.request.Request(endpoint, method='POST', headers=headers, data=json.dumps(payload).encode('utf-8'))
              with urllib.request.urlopen(request, timeout=20) as response:
                  report['httpStatus'] = response.status
                  assert response.status == 200
                  assert response.headers.get('Access-Control-Allow-Origin') in ('*', origin)
                  result = json.loads(response.read())
                  assert result.get('ok') is True
              report['liveSaveAcknowledged'] = True
          except Exception as error:
              report['error'] = str(error)
              raise
          finally:
              report['checkedAtUtc'] = datetime.now(timezone.utc).isoformat()
              destination.joinpath('live-result.json').write_text(json.dumps(report, indent=2))
              print(json.dumps(report))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webinar-live-qa
          path: /tmp/webinar-live-results/
          retention-days: 7
